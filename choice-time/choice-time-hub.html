<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choice Time Hub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;700&display=swap");

      :root {
        --bg-color: #f0f8ff;
        --card-color: #ffffff;
        --header-font: "Bangers", cursive;
        --body-font: "Poppins", sans-serif;
        --text-dark: #333333;
        --border-light: #e0e0e0;
        --shadow-light: rgba(0, 0, 0, 0.1);
        --link-color: #007bff;
        --before-color: #28a745;
        --after-color: #fd7e14;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: var(--body-font);
        background-color: var(--bg-color);
        margin: 0;
        padding: 1em;
        color: var(--text-dark);
        -webkit-font-smoothing: antialiased;
      }

      /* --- Screen Management --- */
      .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1100px;
        margin: auto;
        padding: 1em;
      }
      .screen.active {
        display: flex;
      }

      h1.screen-title {
        font-family: var(--header-font);
        font-size: clamp(3em, 10vw, 5em);
        letter-spacing: 4px;
        margin: 0.2em 0 0.5em 0;
        text-align: center;
        color: var(--text-dark);
      }
      h1.screen-title i {
        margin-right: 0.2em;
      }

      /* --- Choice Grid --- */
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 2em;
        width: 100%;
      }
      .choice-card {
        background: var(--card-color);
        border-radius: 20px;
        padding: 1.5em;
        text-align: center;
        box-shadow: 0 5px 15px var(--shadow-light);
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        border: 4px solid transparent;
      }
      .choice-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }
      .choice-card i {
        font-size: 5em;
        margin-bottom: 0.2em;
      }
      .choice-card h2 {
        font-family: var(--header-font);
        font-size: 2.2em;
        margin: 0;
        letter-spacing: 2px;
      }

      /* Card Colors */
      [data-activity="reading"] i,
      [data-sub-type="fiction"] i,
      [data-sub-type="nonFiction"] i {
        color: #ff6347;
      }
      [data-activity="coding"] i {
        color: #1e90ff;
      }
      [data-activity="building"] i {
        color: #ffc107;
      }
      [data-activity="art"] i {
        color: #9b59b6;
      }
      [data-activity="boardGames"] i {
        color: #2ecc71;
      }
      [data-activity="puzzles"] i {
        color: #e67e22;
      }
      [data-activity="skillsPractice"] i {
        color: #3498db;
      }

      /* --- FOCUSED TASK SCREEN --- */
      #task-screen {
        max-width: 800px;
      }
      .task-section {
        background-color: var(--card-color);
        width: 100%;
        border-radius: 20px;
        padding: 2em;
        box-shadow: 0 5px 15px var(--shadow-light);
        margin-bottom: 2em;
      }
      .task-section h2 {
        font-family: var(--header-font);
        font-size: 2.5em;
        letter-spacing: 2px;
        margin: 0 0 0.5em 0;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .task-section.before h2 {
        color: var(--before-color);
      }
      .task-section.after h2 {
        color: var(--after-color);
      }
      .task-prompt {
        font-size: 1.5em;
        line-height: 1.6;
      }
      .task-example {
        font-size: 1em;
        margin-top: 1.5em;
        padding-top: 1.5em;
        border-top: 3px dashed var(--border-light);
        color: #555;
      }
      .task-example p:first-of-type {
        font-weight: bold;
      }

      /* Resource Links */
      #resource-links-container {
        width: 100%;
        margin-bottom: 2em;
        padding: 1.5em;
        background-color: #e7f3ff;
        border-radius: 15px;
        border: 2px dashed var(--link-color);
      }
      #resource-links-container h3 {
        font-family: var(--header-font);
        font-size: 2em;
        text-align: center;
        margin: 0 0 1em 0;
      }
      .resource-list {
        display: flex;
        flex-direction: column;
        gap: 1em;
        align-items: center;
      }
      .resource-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .resource-item p {
        margin: 0.2em 0 0 0;
        font-style: italic;
        color: #555;
      }

      /* Navigation Buttons */
      .button-container {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1em;
        margin-top: 1.5em;
      }
      .nav-button {
        font-size: 1.2em;
        font-weight: bold;
        padding: 12px 30px;
        background-color: #eee;
        border: 2px solid #ddd;
        border-radius: 12px;
        cursor: pointer;
        transition: background-color 0.2s;
        text-decoration: none;
        color: var(--text-dark);
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
      }
      .nav-button:hover {
        background-color: #ddd;
      }
      .resource-link {
        background-color: var(--link-color);
        color: white;
        border-color: var(--link-color);
      }
      .resource-link:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <!-- SCREEN 1: Main Menu -->
    <div id="hub-screen" class="screen active">
      <h1 class="screen-title">Choice Time Hub</h1>
      <div id="hub-grid" class="choice-grid"></div>
    </div>

    <!-- SCREEN 2a: Reading Sub-Menu -->
    <div id="reading-submenu-screen" class="screen">
      <h1 class="screen-title">
        <i class="fa-solid fa-book-open"></i> Reading
      </h1>
      <div id="reading-submenu-grid" class="choice-grid">
        <div class="choice-card" data-sub-type="fiction">
          <i class="fa-solid fa-dragon"></i>
          <h2>Fiction</h2>
        </div>
        <div class="choice-card" data-sub-type="nonFiction">
          <i class="fa-solid fa-landmark"></i>
          <h2>Non-Fiction</h2>
        </div>
      </div>
      <div class="button-container">
        <button class="nav-button" data-target="hub-screen">
          <i class="fa-solid fa-arrow-left"></i> Back to All Choices
        </button>
      </div>
    </div>

    <!-- SCREEN 2b: Task Menu -->
    <div id="activity-menu-screen" class="screen">
      <h1 id="activity-menu-title" class="screen-title"></h1>
      <div id="task-grid" class="choice-grid"></div>
      <div class="button-container">
        <button class="nav-button" id="back-to-hub-or-reading-button">
          <i class="fa-solid fa-arrow-left"></i> Back
        </button>
      </div>
    </div>

    <!-- SCREEN 3: Focused Task View -->
    <div id="task-screen" class="screen">
      <h1 id="task-title" class="screen-title"></h1>
      <div id="resource-links-container"></div>
      <div class="task-section before">
        <h2><i class="fa-solid fa-seedling"></i> Before You Start</h2>
        <div id="before-prompt" class="task-prompt"></div>
      </div>
      <div class="task-section after">
        <h2><i class="fa-solid fa-tree"></i> After You Finish</h2>
        <div id="after-prompt" class="task-prompt"></div>
        <div id="task-example" class="task-example"></div>
      </div>
      <div class="button-container">
        <button class="nav-button" id="back-to-tasks-button">
          <i class="fa-solid fa-arrow-left"></i> Back to Tasks
        </button>
        <button class="nav-button" data-target="hub-screen">
          <i class="fa-solid fa-house"></i> Back to Main Menu
        </button>
      </div>
    </div>

      document.addEventListener("DOMContentLoaded", () => {
        // Get all the elements
        const hubGrid = document.getElementById("hub-grid");
        const readingSubmenuGrid = document.getElementById(
          "reading-submenu-grid",
        );
        const activityMenuTitle = document.getElementById(
          "activity-menu-title",
        );
        const taskGrid = document.getElementById("task-grid");
        const resourceLinksContainer = document.getElementById(
          "resource-links-container",
        );
        const taskTitle = document.getElementById("task-title");
        const beforePromptDiv = document.getElementById("before-prompt");
        const afterPromptDiv = document.getElementById("after-prompt");
        const taskExampleDiv = document.getElementById("task-example");
        const backToHubOrReadingButton = document.getElementById(
          "back-to-hub-or-reading-button",
        );
        const backToTasksButton = document.getElementById(
          "back-to-tasks-button",
        );

        // Keep track of the user's location
        let currentActivityKey = null;
        let currentSubType = null;

        // --- Navigation Logic ---
        function showScreen(screenId) {
          document
            .querySelectorAll(".screen")
            .forEach((s) => s.classList.remove("active"));
          document.getElementById(screenId).classList.add("active");
        }

        document
          .querySelectorAll(".nav-button[data-target]")
          .forEach((button) => {
            button.addEventListener("click", () =>
              showScreen(button.dataset.target),
            );
          });

        backToHubOrReadingButton.addEventListener("click", () => {
          const targetScreen =
            backToHubOrReadingButton.getAttribute("data-target");
          if (targetScreen) showScreen(targetScreen);
        });

        backToTasksButton.addEventListener("click", () => {
          showActivityMenu(currentActivityKey, currentSubType);
        });

        // --- Dynamic Page Building ---

        // Build the main hub menu on page load
        Object.keys(activitiesData).forEach((key) => {
          const activity = activitiesData[key];
          const card = document.createElement("div");
          card.className = "choice-card";
          card.dataset.activity = key;
          card.innerHTML = `<i class="${activity.icon}"></i><h2>${activity.title}</h2>`;
          hubGrid.appendChild(card);
        });

        // Build the task menu for a chosen activity
        function showActivityMenu(activityKey, subType = null) {
          currentActivityKey = activityKey;
          currentSubType = subType;

          const activitySource = activitiesData[activityKey];
          const activity = subType ? activitySource[subType] : activitySource;
          const icon = activitySource.icon;

          activityMenuTitle.innerHTML = `<i class="${icon}"></i> ${activity.title}`;
          taskGrid.innerHTML = "";

          activity.cards.forEach((card, index) => {
            const taskCard = document.createElement("div");
            taskCard.className = "choice-card";
            taskCard.dataset.activity = activityKey;
            taskCard.dataset.subType = subType || "";
            taskCard.dataset.taskIndex = index;
            taskCard.innerHTML = `<h2>${card.title}</h2>`;
            taskGrid.appendChild(taskCard);
          });

          const backTarget =
            activityKey === "reading" ? "reading-submenu-screen" : "hub-screen";
          backToHubOrReadingButton.setAttribute("data-target", backTarget);

          showScreen("activity-menu-screen");
        }

        // Build the final, focused task screen
        function showTask(activityKey, subType, taskIndex) {
          const activitySource = activitiesData[activityKey];
          const activity = subType ? activitySource[subType] : activitySource;
          const task = activity.cards[taskIndex];
          const icon = activitySource.icon;

          taskTitle.innerHTML = `<i class="${icon}"></i> ${task.title}`;

          // Populate Before/After prompts
          beforePromptDiv.innerHTML = activitySource.beforePrompt;
          afterPromptDiv.innerHTML = task.afterPrompt;
          taskExampleDiv.innerHTML = task.example;

          // Handle Links
          resourceLinksContainer.innerHTML = "";
          if (activitySource.links) {
            let linksHTML = '<h3>Helpful Links</h3><div class="resource-list">';
            activitySource.links.forEach((link) => {
              linksHTML += `
                    <div class="resource-item">
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="nav-button resource-link">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> ${link.name}
                        </a>
                        <p>${link.description}</p>
                    </div>`;
            });
            linksHTML += "</div>";
            resourceLinksContainer.innerHTML = linksHTML;
            resourceLinksContainer.style.display = "block";
          } else {
            resourceLinksContainer.style.display = "none";
          }

          showScreen("task-screen");
        }

        // --- Event Listeners to navigate between screens ---

        hubGrid.addEventListener("click", (e) => {
          const card = e.target.closest(".choice-card");
          if (card) {
            const activityKey = card.dataset.activity;
            if (activityKey === "reading") {
              showScreen("reading-submenu-screen");
            } else {
              showActivityMenu(activityKey);
            }
          }
        });

        readingSubmenuGrid.addEventListener("click", (e) => {
          const card = e.target.closest(".choice-card");
          if (card) {
            showActivityMenu("reading", card.dataset.subType);
          }
        });

        taskGrid.addEventListener("click", (e) => {
          const card = e.target.closest(".choice-card");
          if (card) {
            const { activity, subType, taskIndex } = card.dataset;
            showTask(activity, subType || null, taskIndex);
          }
        });
      });
    </script>
  </body>
</html>
