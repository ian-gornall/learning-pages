<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Capacity Monitor</title>
    
    <!-- IMPORT 1: Google Fonts (Montserrat for that clean Montessori look) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- IMPORT 2: FontAwesome Icons (Standard library for UI icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #1e293b;
            --tank-bg: #0f172a;
            --liquid-safe: #34d399;   /* Green */
            --liquid-warn: #fbbf24;   /* Yellow */
            --liquid-danger: #f87171; /* Red */
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- DASHBOARD LAYOUT --- */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Split screen: Controls vs Tank */
            gap: 40px;
            width: 90%;
            max-width: 1000px;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- LEFT SIDE: INSTANT METER & CONTROLS --- */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .instant-meter-box {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .icon-pulse {
            font-size: 3rem;
            color: #94a3b8;
            transition: transform 0.05s, color 0.1s;
        }
        
        .meter-label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8; margin-top: 10px; display: block;}

        .controls-box {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
        }

        .control-row { margin-bottom: 20px; }
        .control-row label { display: flex; align-items: center; gap: 10px; font-weight: bold; margin-bottom: 5px;}
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--liquid-safe); }
        
        button#btn-start {
            width: 100%;
            padding: 15px;
            background-color: var(--liquid-safe);
            border: none;
            border-radius: 8px;
            color: #064e3b;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button#btn-start:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* --- RIGHT SIDE: THE TANK (THE LEAKY BUCKET) --- */
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tank-container {
            width: 150px;
            height: 400px;
            background-color: var(--tank-bg);
            border: 4px solid #475569;
            border-radius: 0 0 20px 20px; /* Rounded bottom like a test tube */
            border-top: none;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* The Liquid */
        .tank-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; /* JS changes this */
            background-color: var(--liquid-safe);
            transition: height 0.2s ease-out, background-color 0.5s;
            opacity: 0.9;
        }

        /* Visual markers on the tank */
        .tank-marker {
            position: absolute;
            left: 0; right: 0;
            border-top: 1px dashed rgba(255,255,255,0.2);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            padding-left: 5px;
        }

        /* Top "Faucet" Icon */
        .faucet-icon {
            font-size: 2rem;
            color: #64748b;
            margin-bottom: 10px;
        }
        
        /* Bottom "Drain" Icon */
        .drain-icon {
            font-size: 1.5rem;
            color: #64748b;
            margin-top: 10px;
        }

        /* --- OVERLAYS --- */
        .overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ef4444;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: alertPulse 1s infinite;
        }

        .overlay-content {
            background: white;
            color: #ef4444;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 500px;
        }

        .timer-big { font-size: 6rem; font-weight: 900; font-variant-numeric: tabular-nums; margin: 10px 0; }
        
        .btn-action {
            padding: 15px 30px;
            border: 2px solid #ef4444;
            background: transparent;
            color: #ef4444;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 10px;
        }
        .btn-action:hover { background: #ef4444; color: white; }

        @keyframes alertPulse {
            0% { background-color: #ef4444; }
            50% { background-color: #b91c1c; }
            100% { background-color: #ef4444; }
        }

    </style>
</head>
<body>

    <div class="dashboard">
        
        <!-- CONTROLS & INSTANT -->
        <div class="left-panel">
            <div>
                <h1><i class="fa-solid fa-ear-listen"></i> Noise Monitor</h1>
                <p style="color: #94a3b8;">When noise exceeds the threshold, the tank fills. When quiet, it drains.</p>
            </div>

            <div class="instant-meter-box">
                <!-- This icon scales with volume -->
                <i id="instant-icon" class="fa-solid fa-volume-off icon-pulse"></i>
                <span class="meter-label">Instant Volume</span>
            </div>

            <div class="controls-box">
                <button id="btn-start" onclick="initAudio()">
                    <i class="fa-solid fa-play"></i> Start Listening
                </button>
                
                <div class="control-row" style="margin-top: 20px;">
                    <label><i class="fa-solid fa-ruler-horizontal"></i> Sensitivity (Threshold)</label>
                    <input type="range" id="thresh-slider" min="0" max="100" value="40">
                </div>

                <div class="control-row">
                    <label><i class="fa-solid fa-stopwatch"></i> Patience (Drain Speed)</label>
                    <input type="range" id="drain-slider" min="1" max="10" value="5">
                </div>
            </div>
        </div>

        <!-- THE TANK -->
        <div class="right-panel">
            <div class="faucet-icon"><i class="fa-solid fa-faucet-drip"></i> Noise Input</div>
            
            <div class="tank-container">
                <div class="tank-marker" style="bottom: 75%">CRITICAL</div>
                <div class="tank-marker" style="bottom: 50%">WARNING</div>
                <div class="tank-marker" style="bottom: 25%">SAFE</div>
                
                <div id="liquid" class="tank-liquid"></div>
            </div>

            <div class="drain-icon"><i class="fa-solid fa-arrow-down"></i> Draining (Quiet)</div>
            <h2 id="percent-display">0%</h2>
        </div>
    </div>

    <!-- ALARM OVERLAY -->
    <div id="alarm-overlay" class="overlay">
        <div class="overlay-content">
            <h1><i class="fa-solid fa-bell"></i> TOO LOUD</h1>
            <p>Please ring the chime. Wait for silence.</p>
            <div id="timer-display" class="timer-big">10:00</div>
            <button class="btn-action" onclick="startTimer()" id="btn-timer">Start Silent Timer</button>
            <br>
            <button style="margin-top: 20px; border:none; background:none; color:#999; cursor:pointer; text-decoration:underline;" onclick="resetSystem()">False Alarm / Reset</button>
        </div>
    </div>

    <script>
        // --- LOGIC ---
        let audioCtx, analyser, source, scriptNode;
        let isRunning = false;
        let isAlarm = false;
        let timerInterval;

        // Variables
        let currentVol = 0;
        let stressLevel = 0; // 0 to 100 (The Liquid Level)
        let threshold = 40;  // Input slider
        let drainSpeed = 0.5; // Input slider
        const SILENT_MINUTES = 10;

        // UI References
        const liquid = document.getElementById('liquid');
        const instantIcon = document.getElementById('instant-icon');
        const percentDisplay = document.getElementById('percent-display');
        const alarmOverlay = document.getElementById('alarm-overlay');
        const timerDisplay = document.getElementById('timer-display');
        const btnTimer = document.getElementById('btn-timer');

        // Slider Inputs
        document.getElementById('thresh-slider').oninput = function() { threshold = this.value; };
        document.getElementById('drain-slider').oninput = function() { drainSpeed = this.value * 0.15; }; // Scale nicely

        async function initAudio() {
            if(isRunning) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
                source = audioCtx.createMediaStreamSource(stream);
                
                source.connect(analyser);
                analyser.connect(scriptNode);
                scriptNode.connect(audioCtx.destination);
                
                analyser.smoothingTimeConstant = 0.3;
                analyser.fftSize = 1024;

                isRunning = true;
                document.getElementById('btn-start').innerHTML = '<i class="fa-solid fa-microphone-lines"></i> Listening...';
                
                scriptNode.onaudioprocess = processAudio;
                requestAnimationFrame(updateLoop);
            } catch(e) {
                alert("Please allow Microphone access to use this tool.");
            }
        }

        function processAudio() {
            if (!isRunning) return;
            let array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);
            let values = 0;
            for (let i = 0; i < array.length; i++) values += array[i];
            
            // Normalize volume (roughly 0-100)
            let avg = values / array.length;
            currentVol = Math.min(avg * 1.5, 100);
        }

        function updateLoop() {
            if (!isRunning || isAlarm) return requestAnimationFrame(updateLoop);

            // 1. Update Instant Icon (The Speaker)
            // Scale icon based on volume (1.0 to 1.5 scale)
            let scale = 1 + (currentVol / 200);
            instantIcon.style.transform = `scale(${scale})`;
            
            // Change icon based on intensity
            if(currentVol < 10) instantIcon.className = "fa-solid fa-volume-off icon-pulse";
            else if(currentVol < threshold) instantIcon.className = "fa-solid fa-volume-low icon-pulse";
            else instantIcon.className = "fa-solid fa-volume-high icon-pulse";
            
            if(currentVol > threshold) instantIcon.style.color = "#fbbf24";
            else instantIcon.style.color = "#94a3b8";

            // 2. The Leaky Bucket Logic
            if (currentVol > threshold) {
                // FILL: The louder it is over the limit, the faster it fills
                let excess = currentVol - threshold;
                stressLevel += (excess * 0.05); 
            } else {
                // DRAIN: Constant drain when quiet
                stressLevel -= drainSpeed;
            }

            // Clamp
            if (stressLevel < 0) stressLevel = 0;
            if (stressLevel > 100) stressLevel = 100;

            // 3. Update The Tank Visuals
            liquid.style.height = stressLevel + "%";
            percentDisplay.innerText = Math.round(stressLevel) + "%";

            // Color Coding
            if(stressLevel < 50) {
                liquid.style.backgroundColor = "var(--liquid-safe)"; // Green
            } else if (stressLevel < 85) {
                liquid.style.backgroundColor = "var(--liquid-warn)"; // Yellow
            } else {
                liquid.style.backgroundColor = "var(--liquid-danger)"; // Red
            }

            // 4. Trigger Alarm
            if (stressLevel >= 100) {
                triggerAlarm();
            } else {
                requestAnimationFrame(updateLoop);
            }
        }

        function triggerAlarm() {
            isAlarm = true;
            alarmOverlay.style.display = 'flex';
            timerDisplay.innerText = SILENT_MINUTES + ":00";
            btnTimer.disabled = false;
            btnTimer.innerText = "Start Silent Timer";
        }

        function startTimer() {
            btnTimer.disabled = true;
            btnTimer.innerText = "Silence In Progress...";
            let time = SILENT_MINUTES * 60;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                if (s < 10) s = "0" + s;
                timerDisplay.innerText = `${m}:${s}`;
                
                if (time <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "DONE";
                    btnTimer.innerText = "Reset Class";
                    btnTimer.disabled = false;
                    btnTimer.onclick = resetSystem;
                }
                time--;
            }, 1000);
        }

        function resetSystem() {
            isAlarm = false;
            clearInterval(timerInterval);
            alarmOverlay.style.display = 'none';
            stressLevel = 0;
            liquid.style.height = "0%";
            
            // Reset Button Logic
            btnTimer.onclick = startTimer;
            
            requestAnimationFrame(updateLoop);
        }

    </script>
</body>
</html>
